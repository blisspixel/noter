[package]
name = "noter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"   # Conservative baseline; raise only after testing. 2026 reality will likely be 1.88–1.92.
authors = ["Nick <noter@local>"]  # Update when you have a real identity / org
description = "A pure, reliable, cross-platform plain text editor in Rust. The notepad you actually want."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/noter"  # Update on first publish
keywords = ["notepad", "text-editor", "plain-text", "egui", "cross-platform", "rust"]
categories = ["gui", "text-editors", "command-line-utilities"]  # "command-line-utilities" is a stretch but fine for discoverability

# =============================================================================
# Planned dependencies (June 2026 GA versions — latest sensible stable releases)
# Introduced gradually by phase. See ROADMAP.md + DESIGN.md for justification policy.
# We are conservative on pre-release crates for a "reliability first" tool.
# =============================================================================
# Phase 0–1 (core reliability & classic notepad experience)
#   egui             = "0.34"   # + eframe = "0.34.3" (latest GA as of June 2026, MSRV 1.85)
#   rfd              = "0.17"   # Native file dialogs (mandatory). 0.17.2 current.
#   directories      = "6.0"    # Cross-platform config/cache paths. 6.0.0 current.
#   serde            = { version = "1.0", features = ["derive"] }
#   toml             = "1.1"    # Human-readable, git-friendly config. 1.1.2+spec current.
#   thiserror        = "2.0"    # Typed errors with good Display. 2.0.18 current.
#   ropey            = "1.6"    # The text buffer. Latest stable 1.x series.
#                               # 2.0.0-beta.1 exists (June 2026) but we stay on proven 1.x
#                               # for v0.x reliability. Re-evaluate post-stabilization.
#   tracing          = "0.1.44"
#   tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "time"] }
#   dark-light       = "2.0"    # Clean system theme detection (Windows registry, macOS appearance,
#                               # Linux gsettings). MSRV 1.78. Preferred over hand-rolled for v1.
#
# Phase 2–3 (polish + markdown QOL)
#   pulldown-cmark   = "0.13"   # CommonMark parser for the preview (pure Rust). 0.13.4 current.
#   proptest         = "1.11"   # Property-based tests for invariants (dev-dependency).
#   tempfile         = "3.27"   # Golden tests & recovery simulation (dev-dependency).
#
# Future / only if justified (and after GA)
#   notify           = "9"      # 9.0.0-rc.4 in June 2026 — still pre-release. Use mtime polling first.
#
# Strict policy: Every added dependency requires (a) written justification in DESIGN.md,
# (b) `cargo tree -i <name>` audit, (c) binary size impact measurement at the phase gate.

[dependencies]

# =============================================================================
# Profiles tuned for a small, fast, reliable GUI tool
# =============================================================================
[profile.release]
opt-level = 3          # "z" for maximum size reduction if we are desperate; 3 usually wins on speed+size for egui
lto = true
codegen-units = 1
strip = true           # Strip symbols (huge win for size)
panic = "abort"        # We handle errors gracefully; abort is fine and smaller

[profile.dev]
opt-level = 1          # Slightly faster debug builds for UI work without killing compile time

# =============================================================================
# Lints (modern 2024 style — we will tighten over time)
# =============================================================================
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"   # We want good docs on core types

[lints.clippy]
# 2026-era priority syntax required because we mix group lints with specific allows.
# Lower priority on the broad groups so the specific "allow" entries can override.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# These are often too noisy for GUI apps early on; we can re-enable selectively.
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

# =============================================================================
# cargo-dist metadata (Phase 4 packaging)
# See https://github.com/axodotdev/cargo-dist
# =============================================================================
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"   # Update to current when we reach Phase 4
ci = ["github"]
installers = ["shell", "msi", "homebrew"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# pr-run-mode = "plan"  # Use "upload" for real releases

# =============================================================================
# Notes for future maintainers
# =============================================================================
# - Keep dependencies under very tight control. Binary size and compile time are features.
# - The core editing and I/O logic must remain completely independent of egui (see DESIGN.md).
# - Every time you add a dependency, run `cargo tree -i <crate>` and document the justification.
