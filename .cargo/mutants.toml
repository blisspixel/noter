# Mutation testing is intentionally scoped to Noter's trust kernel. GUI code is
# covered by semantic UI tests in later milestones, not padded into this gate.
examine_globs = ["src/core/*.rs", "crates/noter-platform/src/*.rs"]
# Unsupported-platform shims cannot execute in the supported-platform matrix.
# The OR-to-XOR changes below are algebraically identical because each native
# API flag occupies a disjoint bit.
exclude_re = [
    "imp::.*unsupported",
    "replace \\| with \\^ in imp::windows_(create_private_new_file|open_existing_no_follow|open_for_cleanup|reduced_identity)",
    "replace \\| with \\^ in imp::macos_private_creation::OwnedFileSecurity::create",
    # Single-variant encoding tag is schema padding; the only legal value is 0.
    "encode_encoding",
    # Hex helpers are covered by path-name round trips; arithmetic mutants on
    # pure formatters do not change durable recovery safety.
    "hex8",
    "hex16",
    # TOCTOU and cross-volume race match-guards cannot be forced reliably from
    # portable tests without mocking the platform install/rename path. The
    # success and failure surfaces around them are covered by store round-trips.
    "match guard error\\.kind\\(\\) == io::ErrorKind::NotFound in RecoveryStore::quarantine_file",
    "match guard error\\.kind\\(\\) == io::ErrorKind::AlreadyExists in commit_staged_record",
    "replace == with != in commit_staged_record",
    "replace == with != in RecoveryStore::quarantine_file",
]
all_features = true
test_workspace = true
additional_cargo_args = ["--locked"]
minimum_test_timeout = 20
