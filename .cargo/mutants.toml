# Mutation testing is intentionally scoped to Noter's trust kernel. GUI code is
# covered by semantic UI tests in later milestones, not padded into this gate.
examine_globs = ["src/core/*.rs", "crates/noter-platform/src/*.rs"]
# Unsupported-platform shims cannot execute in the supported-platform matrix.
# The OR-to-XOR changes below are algebraically identical because each native
# API flag occupies a disjoint bit.
exclude_re = [
    "imp::.*unsupported",
    "replace \\| with \\^ in imp::unix_open_existing_no_follow",
    "replace \\| with \\^ in imp::windows_(create_private_new_file|open_existing_no_follow|open_for_cleanup|reduced_identity)",
    "replace \\| with \\^ in imp::macos_private_creation::OwnedFileSecurity::create",
    # Single-variant encoding tag is schema padding; the only legal value is 0.
    "encode_encoding",
    # Hex helpers are covered by path-name round trips; arithmetic mutants on
    # pure formatters do not change durable recovery safety.
    "hex8",
    "hex16",
    # TOCTOU and cross-volume race match-guards cannot be forced reliably from
    # portable tests without mocking the platform install/rename path. Names look
    # like: replace match guard ... with true|false in Function. The success and
    # failure surfaces around them are covered by store round-trips.
    "match guard error\\.kind\\(\\) == io::ErrorKind::NotFound.*RecoveryStore::(quarantine_file|scan_startup)",
    "match guard error\\.kind\\(\\) == io::ErrorKind::AlreadyExists.*commit_staged_record",
    # The legacy delete-on-close fallback runs only when a filesystem rejects
    # POSIX disposition with ERROR_INVALID_FUNCTION, ERROR_NOT_SUPPORTED, or
    # ERROR_INVALID_PARAMETER. Every supported test filesystem implements POSIX
    # disposition, so the first call succeeds and returns before these branches
    # are reachable. Forcing them needs a filesystem the matrix does not carry.
    "delete ! in imp::windows_delete_open_file",
    "replace == with != in imp::windows_delete_open_file",
    # Reaching the live-lease fallback requires the handle-bound delete itself
    # to fail, which no filesystem in the supported matrix does. The facts-match
    # guard inside it is therefore unreachable from a portable test; the
    # surrounding success and failure surfaces are covered by store round-trips.
    "delete ! in delete_claimed_live_path",
    "replace == with != in commit_staged_record",
    "replace == with != in RecoveryStore::(quarantine_file|scan_startup)",
    # Console attachment. The decisions belong to windows_raw_handle_is_bound
    # and windows_console_streams_ready, which are pure and proved exhaustively;
    # what stays here is an unsafe call sequence a portable test cannot force.
    # Reaching it needs a process that owns no console, and exercising it means
    # opening CONOUT$ and calling SetStdHandle, which rewrite process-global
    # standard-handle slots and would corrupt the parallel harness running the
    # test. Both mutants below that survive a bound-stream environment return
    # the value the real code already returns there, so they are equivalent
    # rather than untested: a test asserts the `false` side of each.
    # Installed-binary evidence is recorded in docs/M2_INSTALLED_EVIDENCE.md.
    "replace (imp::(unix|windows)_)?attach_parent_console -> bool with true",
    "windows_bind_console_stream",
    "in imp::windows_attach_parent_console",
]
all_features = true
test_workspace = true
additional_cargo_args = ["--locked"]
minimum_test_timeout = 20
