[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # RUSTSEC-2026-0370: zvariant is unmaintained as standalone crate; merged into zbus 6.0 wire module.
    # Transitive dependency of accesskit_unix 0.21.1 / atspi-common 0.13.0 via eframe.
    # No standalone patched version exists; tracked for upstream accesskit upgrade (Issue #84).
    "RUSTSEC-2026-0370",

    # RUSTSEC-2026-0371: zbus_names is unmaintained as standalone crate; merged into zbus 6.0 names module.
    # Transitive dependency of accesskit_unix 0.21.1 / atspi-common 0.13.0 via eframe.
    # No standalone patched version exists; tracked for upstream accesskit upgrade (Issue #84).
    "RUSTSEC-2026-0371",

    # RUSTSEC-2026-0372: zvariant_derive is unmaintained as standalone crate; merged into zbus 6.0.
    # Transitive dependency of accesskit_unix 0.21.1 / atspi-common 0.13.0 via eframe.
    # No standalone patched version exists; tracked for upstream accesskit upgrade (Issue #84).
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
