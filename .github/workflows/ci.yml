name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Install cargo-audit
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build (debug)
        run: cargo build --locked --verbose --workspace --all-features

      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-targets --all-features

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Generate coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cargo llvm-cov --locked --all-targets --all-features --workspace
          --ignore-filename-regex 'src[/\\](app|main)\.rs$'
          --fail-under-lines 90
          --lcov --output-path lcov.info
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: lcov.info

  mutation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scope: linux-common
          - os: windows-latest
            scope: windows-full
          - os: macos-latest
            scope: macos-platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Run Linux trust-kernel mutation tests
        if: runner.os == 'Linux'
        env:
          # rust-cache disables incremental builds by default. Mutation builds
          # deliberately need them because each scenario changes one expression.
          CARGO_INCREMENTAL: 1
        run: >
          cargo mutants -vV --in-place --colors never --workspace
          --exclude-re
          '(is_final_link|reconcile_existing_failure|replacement_backup_path|is_documented_partial_replacement|finalize_unexpected_displaced_destination|[Ww]indows|[Mm]acos)'
      - name: Run Windows trust-kernel mutation tests
        if: runner.os == 'Windows'
        env:
          CARGO_INCREMENTAL: 1
        run: >
          cargo mutants -vV --in-place --colors never --workspace
          --exclude-re
          '(required_metadata|metadata_source_status|post_exchange_source_facts_match|finalize_unix_displaced_destination|unix|linux|[Mm]acos)'
      - name: Run macOS platform mutation tests
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 1
        run: >
          cargo mutants -vV --in-place --colors never --workspace
          -p noter-platform
          --exclude-re '([Ww]indows|linux)'
      - name: Reject infrastructure failures hidden as unviable mutants
        if: always()
        run: python scripts/check_mutation_infrastructure.py mutants.out
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results-${{ matrix.scope }}
          path: mutants.out

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that key planning documents exist and are not empty
        run: |
          test -s README.md
          test -s CHANGELOG.md
          test -s LICENSE
          test -s docs/RESEARCH.md
          test -s docs/BASELINE.md
          test -s docs/M1_MUTATION_EVIDENCE.md
          test -s docs/M1_SECURITY_REVIEW.md
          test -s docs/REQUIREMENTS.md
          test -s docs/DESIGN.md
          test -s docs/ROADMAP.md
          test -s docs/PRIVACY.md
          test -s docs/adr/0001-egui-and-editor-gate.md
          test -s docs/adr/0002-encoding-and-line-endings.md
          test -s docs/adr/0003-durable-replacement.md
          test -s docs/CODE-QUALITY-STANDARDS.md
          echo "All core planning documents present and non-empty."
      - name: Check local documentation links
        run: python3 scripts/check_doc_links.py
      - name: Test repository validation scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
