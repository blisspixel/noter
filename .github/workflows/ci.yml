name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Install cargo-audit
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit locked dependencies
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19
        with:
          tool: cargo-deny@0.19.8
          fallback: none
      - name: Check dependency licenses, sources, and bans
        run: cargo deny --locked check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build (debug)
        run: cargo build --locked --verbose --workspace --all-features

      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-targets --all-features

      - name: Run Windows repository validation tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Install from source (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            $env:CARGO_INSTALL_ROOT = 'noter installer root'
            & $installer -Source $env:GITHUB_WORKSPACE
          } finally {
            Pop-Location
          }

      - name: Install from source (POSIX)
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh -n scripts/install.sh
          installer=$PWD/scripts/install.sh
          cd "$RUNNER_TEMP"
          CARGO_INSTALL_ROOT='noter installer root' sh "$installer" --source "$GITHUB_WORKSPACE"

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Enforce whole-workspace coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cargo llvm-cov --locked --all-targets --all-features --workspace
          --fail-under-lines 80
          --lcov --output-path lcov.info
      - name: Enforce trust-kernel coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cargo llvm-cov --locked --all-targets --all-features --workspace
          --ignore-filename-regex
          'src[/\\](app|bounded_text_input|editor_settings|find_ui|go_to_line_ui|idle_screen|main|markdown_ui|theme)\.rs$'
          --fail-under-lines 90
          --summary-only
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: lcov.info

  mutation:
    name: mutation-${{ matrix.scope }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three Linux shards retain the complete deterministic candidate
          # partition with margin beneath the 90-minute fail-closed ceiling.
          - os: ubuntu-latest
            scope: linux-0-of-3
            shard: 0/3
          - os: ubuntu-latest
            scope: linux-1-of-3
            shard: 1/3
          - os: ubuntu-latest
            scope: linux-2-of-3
            shard: 2/3
          # Six Windows shards retain the complete deterministic candidate
          # partition with enough margin beneath the 90-minute fail-closed
          # ceiling. One aggregate check remains stable if the partition grows.
          - os: windows-latest
            scope: windows-0-of-6
            shard: 0/6
          - os: windows-latest
            scope: windows-1-of-6
            shard: 1/6
          - os: windows-latest
            scope: windows-2-of-6
            shard: 2/6
          - os: windows-latest
            scope: windows-3-of-6
            shard: 3/6
          - os: windows-latest
            scope: windows-4-of-6
            shard: 4/6
          - os: windows-latest
            scope: windows-5-of-6
            shard: 5/6
          - os: macos-latest
            scope: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Run Linux trust-kernel mutation tests
        if: runner.os == 'Linux'
        env:
          # rust-cache disables incremental builds by default. Mutation builds
          # deliberately need them because each scenario changes one expression.
          # Windows owns handle-bound temporary and backup cleanup. Unix keeps
          # those artifacts when safe handle-bound deletion is unavailable.
          CARGO_INCREMENTAL: 1
        run: >
          cargo mutants -vV --in-place --colors never --workspace
          --shard ${{ matrix.shard }}
          --exclude-re
          '(is_final_link|reconcile_existing_failure|replacement_backup_path|is_documented_partial_replacement|finalize_unexpected_displaced_destination|TemporaryFile::discard|TemporaryFile::preserve_artifact|Drop for TemporaryFile|closed_temporary_matches_intended|remove_verified_backup|[Ww]indows|[Mm]acos)'
      - name: Run Windows trust-kernel mutation tests
        if: runner.os == 'Windows'
        env:
          # Windows runners occasionally exceed cargo-mutants' 20-second
          # auto-selected test floor while a failing suite is unwinding.
          # Sixty seconds preserves finite-failure evidence without weakening
          # the job's 90-minute outer bound.
          #
          # The exclusion below must name every Unix-gated item, in both cases.
          # cargo-mutants builds its candidate list by parsing source without
          # evaluating cfg, so a `#[cfg(unix)]` item still yields candidates
          # here. Those mutants compile out of the Windows binary, no test can
          # observe them, and they are reported missed rather than unviable.
          CARGO_INCREMENTAL: 1
        run: >
          cargo mutants -vV --in-place --colors never --workspace
          --minimum-test-timeout 60
          --shard ${{ matrix.shard }}
          --exclude-re
          '(required_metadata|metadata_source_status|post_exchange_source_facts_match|finalize_unix_displaced_destination|[Uu]nix|from_open_parent|linux|[Mm]acos)'
      - name: Run macOS platform mutation tests
        if: runner.os == 'macOS'
        env:
          # Apple clang 21 crashed even after workspace links were serialized
          # while repeatedly linking test binaries with full debug information.
          # It later crashed once more while linking 107 stripped test objects.
          # Keep the complete workspace test scope and incremental rebuilds, but
          # cap codegen units so every repeated linker invocation is bounded.
          # The ordinary macOS test job retains its normal debug profile.
          # Windows shards own Windows-only commit receipt mutations; selecting
          # them on macOS produces equivalent, non-executable mutants.
          # When the infrastructure gate still sees a linker flake hidden as
          # unviable with zero missed mutants, retry the macOS scope once.
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_TEST_CODEGEN_UNITS: '8'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: 1
        run: |
          set -euo pipefail
          run_macos_mutants() {
            cargo mutants -vV --in-place --colors never --workspace \
              -p noter-platform \
              --re '([Mm]acos|CommitReceipt|ParentSyncReceipt|unix_(replace_existing|install_new|with_sibling_parent))' \
              --exclude-re '([Ww]indows|ParentSyncReceipt::unsupported)'
          }
          run_macos_mutants
          if python scripts/check_mutation_infrastructure.py mutants.out; then
            exit 0
          fi
          echo "macOS mutation infrastructure flake detected; retrying once"
          rm -rf mutants.out
          run_macos_mutants
          python scripts/check_mutation_infrastructure.py mutants.out
      - name: Reject infrastructure failures hidden as unviable mutants
        # macOS validates (and may retry) infrastructure inside its run step.
        if: always() && runner.os != 'macOS'
        run: python scripts/check_mutation_infrastructure.py mutants.out
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results-${{ matrix.scope }}
          path: mutants.out
          if-no-files-found: error

  mutation-gate:
    name: mutation-gate
    needs: mutation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mutation partition to pass
        env:
          MUTATION_MATRIX_RESULT: ${{ needs.mutation.result }}
        run: |
          if [ "$MUTATION_MATRIX_RESULT" != success ]; then
            echo "Mutation matrix result: $MUTATION_MATRIX_RESULT" >&2
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that key planning documents exist and are not empty
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s CONTRIBUTING.md
          test -s CHANGELOG.md
          test -s LICENSE
          test -s THIRD-PARTY-LICENSES.html
          test -s about.toml
          test -s scripts/generate_third_party_licenses.py
          test -s docs/RESEARCH.md
          test -s docs/BASELINE.md
          test -s docs/M1_MUTATION_EVIDENCE.md
          test -s docs/M1_SECURITY_REVIEW.md
          test -s docs/M3_EDITING_EVIDENCE.md
          test -s docs/REQUIREMENTS.md
          test -s docs/DESIGN.md
          test -s docs/ROADMAP.md
          test -s docs/INSTALLATION.md
          test -s docs/RELEASING.md
          test -s docs/DEVELOPMENT.md
          test -s docs/MARKDOWN.md
          test -s docs/PRIVACY.md
          test -s docs/adr/0001-egui-and-editor-gate.md
          test -s docs/adr/0002-encoding-and-line-endings.md
          test -s docs/adr/0003-durable-replacement.md
          test -s docs/CODE-QUALITY-STANDARDS.md
          echo "All core planning documents present and non-empty."
      - name: Check local documentation links
        run: python3 scripts/check_doc_links.py
      - name: Check README screenshot assets
        run: python3 scripts/check_readme_assets.py
      - name: Check release configuration
        shell: python -I {0}
        run: |
          import os
          import runpy

          runpy.run_path(
              os.path.join(
                  os.environ["GITHUB_WORKSPACE"],
                  "scripts",
                  "check_release_config.py",
              ),
              run_name="__main__",
          )
      - name: Verify third-party license inventory
        run: |
          cargo fetch --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
          python3 scripts/generate_third_party_licenses.py \
            --output "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"
          if ! cmp THIRD-PARTY-LICENSES.html "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"; then
            diff --text --unified=3 \
              THIRD-PARTY-LICENSES.html \
              "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html" \
              | head -c 65536 || true
            exit 1
          fi
      - name: Lint repository validation scripts
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.15.16
          ruff check scripts
          ruff format --check scripts
      - name: Test repository validation scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
