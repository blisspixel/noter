name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Formatting & Linting (fast, runs on one platform)
  # ---------------------------------------------------------------------------
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  # ---------------------------------------------------------------------------
  # Tests (matrix across the three platforms we care about)
  # ---------------------------------------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Future: add aarch64 macos runner or specific ubuntu version when needed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build (debug)
        run: cargo build --locked --verbose --workspace --all-features

      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-targets --all-features

      # Optional: coverage on one platform (Linux is usually fastest)
      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19 # cargo-llvm-cov
      - name: Generate coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cargo llvm-cov --locked --all-targets --all-features --workspace
          --ignore-filename-regex 'src[/\\](app|main)\.rs$'
          --fail-under-lines 90
          --lcov --output-path lcov.info
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: lcov.info

  # ---------------------------------------------------------------------------
  # Mutation testing (trust-kernel decision paths, not GUI coverage padding)
  # ---------------------------------------------------------------------------
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@e62b3bdab54265ba809383c8707cb0600da93f19
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Run trust-kernel mutation tests
        run: cargo mutants -vV --in-place --colors never
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results
          path: mutants.out

  # ---------------------------------------------------------------------------
  # Documentation & planning doc sanity (we treat the MD files as code)
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that key planning documents exist and are not empty
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/RESEARCH.md
          test -s docs/BASELINE.md
          test -s docs/M1_MUTATION_EVIDENCE.md
          test -s docs/REQUIREMENTS.md
          test -s docs/DESIGN.md
          test -s docs/ROADMAP.md
          test -s docs/PRIVACY.md
          test -s docs/adr/0001-egui-and-editor-gate.md
          test -s docs/adr/0002-encoding-and-line-endings.md
          test -s docs/adr/0003-durable-replacement.md
          echo "All core planning documents present and non-empty."
      - name: Check local documentation links
        run: python3 scripts/check_doc_links.py

  # ---------------------------------------------------------------------------
  # (Future Phase 4) cargo-dist dry-run or plan on tags
  # We keep a placeholder job so the intent is visible in the workflow from day one.
