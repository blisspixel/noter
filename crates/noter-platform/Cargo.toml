[package]
name = "noter-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Narrow operating-system primitives for Noter's durable storage adapter"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/noter"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
