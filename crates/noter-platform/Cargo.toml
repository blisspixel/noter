[package]
name = "noter-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Narrow operating-system primitives for Noter's durable storage adapter"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/noter"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
xattr = { version = "1.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = { version = "1.6", default-features = false }

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
